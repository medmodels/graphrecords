name: Publish Release

on:
  push:
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSIONS_LONG: "python3.10 python3.11 python3.12 python3.13 python3.14"
  PYTHON_VERSIONS_SHORT: |
    3.10
    3.11
    3.12
    3.13
    3.14

jobs:
  detect-release:
    runs-on: ubuntu-22.04
    outputs:
      publish_rust: ${{ steps.check.outputs.publish_rust }}
      rust_version: ${{ steps.check.outputs.rust_version }}
      rust_tag: ${{ steps.check.outputs.rust_tag }}
      publish_python: ${{ steps.check.outputs.publish_python }}
      python_version: ${{ steps.check.outputs.python_version }}
      python_tag: ${{ steps.check.outputs.python_tag }}

    steps:
      - name: Check for release commit
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          RUST_PATTERN='^release\(rust\): ([0-9]+\.[0-9]+\.[0-9]+)'
          PYTHON_PATTERN='^release\(python\): ([0-9]+\.[0-9]+\.[0-9]+)'
          BOTH_PATTERN='^release: rust ([0-9]+\.[0-9]+\.[0-9]+), python ([0-9]+\.[0-9]+\.[0-9]+)'

          RUST_VERSION=""
          PYTHON_VERSION=""

          if [[ "$FIRST_LINE" =~ $RUST_PATTERN ]]; then
            RUST_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$FIRST_LINE" =~ $PYTHON_PATTERN ]]; then
            PYTHON_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$FIRST_LINE" =~ $BOTH_PATTERN ]]; then
            RUST_VERSION="${BASH_REMATCH[1]}"
            PYTHON_VERSION="${BASH_REMATCH[2]}"
          fi

          if [ -n "$RUST_VERSION" ]; then
            echo "publish_rust=true" >> "$GITHUB_OUTPUT"
            echo "rust_version=$RUST_VERSION" >> "$GITHUB_OUTPUT"
            echo "rust_tag=rust-$RUST_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "publish_rust=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$PYTHON_VERSION" ]; then
            echo "publish_python=true" >> "$GITHUB_OUTPUT"
            echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
            echo "python_tag=python-$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "publish_python=false" >> "$GITHUB_OUTPUT"
          fi

  verify-rust:
    needs: detect-release
    if: needs.detect-release.outputs.publish_rust == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crates
        run: cargo publish --workspace --dry-run

  build-linux:
    needs: detect-release
    if: needs.detect-release.outputs.publish_python == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7, ppc64le]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSIONS_SHORT }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ env.PYTHON_VERSIONS_LONG }}
          sccache: "true"
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-musllinux:
    needs: detect-release
    if: needs.detect-release.outputs.publish_python == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSIONS_SHORT }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ env.PYTHON_VERSIONS_LONG }}
          sccache: "true"
          manylinux: musllinux_1_2

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  build-windows:
    needs: detect-release
    if: needs.detect-release.outputs.publish_python == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSIONS_SHORT }}
          architecture: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ env.PYTHON_VERSIONS_LONG }}
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  build-macos:
    needs: detect-release
    if: needs.detect-release.outputs.publish_python == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSIONS_SHORT }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ env.PYTHON_VERSIONS_LONG }}
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-sdist:
    needs: detect-release
    if: needs.detect-release.outputs.publish_python == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  verify-release:
    needs:
      - detect-release
      - verify-rust
      - build-linux
      - build-musllinux
      - build-windows
      - build-macos
      - build-sdist
    if: ${{ !cancelled() && (needs.detect-release.outputs.publish_rust == 'true' || needs.detect-release.outputs.publish_python == 'true') }}
    runs-on: ubuntu-22.04

    steps:
      - name: Check that every selected target was verified
        env:
          PUBLISH_RUST: ${{ needs.detect-release.outputs.publish_rust }}
          PUBLISH_PYTHON: ${{ needs.detect-release.outputs.publish_python }}
          VERIFY_RUST: ${{ needs.verify-rust.result }}
          BUILD_LINUX: ${{ needs.build-linux.result }}
          BUILD_MUSLLINUX: ${{ needs.build-musllinux.result }}
          BUILD_WINDOWS: ${{ needs.build-windows.result }}
          BUILD_MACOS: ${{ needs.build-macos.result }}
          BUILD_SDIST: ${{ needs.build-sdist.result }}
        run: |
          if [ "$PUBLISH_RUST" = "true" ] && [ "$VERIFY_RUST" != "success" ]; then
            echo "::error::Rust verification did not succeed, nothing is published"
            exit 1
          fi

          if [ "$PUBLISH_PYTHON" = "true" ]; then
            for RESULT in "$BUILD_LINUX" "$BUILD_MUSLLINUX" "$BUILD_WINDOWS" "$BUILD_MACOS" "$BUILD_SDIST"; do
              if [ "$RESULT" != "success" ]; then
                echo "::error::Python builds did not succeed, nothing is published"
                exit 1
              fi
            done
          fi

  publish-rust:
    needs: [detect-release, verify-release]
    if: needs.detect-release.outputs.publish_rust == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-rust:
    needs: [detect-release, publish-rust]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Finalize GitHub release
        id: release
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: release-drafter-rust.yml
          name: Rust ${{ needs.detect-release.outputs.rust_version }}
          tag: ${{ needs.detect-release.outputs.rust_tag }}
          version: ${{ needs.detect-release.outputs.rust_version }}
          commitish: ${{ github.sha }}
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}

  publish-python:
    needs: [detect-release, verify-release]
    if: needs.detect-release.outputs.publish_python == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

  release-python:
    needs: [detect-release, publish-python]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Finalize GitHub release
        id: release
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: release-drafter-python.yml
          name: Python ${{ needs.detect-release.outputs.python_version }}
          tag: ${{ needs.detect-release.outputs.python_tag }}
          version: ${{ needs.detect-release.outputs.python_version }}
          commitish: ${{ github.sha }}
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}

      - name: Upload wheels to release
        run: gh release upload "$TAG" wheels-*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}

      - name: Trigger release workflows
        uses: peter-evans/repository-dispatch@bf47d102fdb849e755b0b0023ea3e81a44b6f570 # v2
        with:
          event-type: python-release
          client-payload: >
            {
              "version": "${{ needs.detect-release.outputs.python_version }}",
              "tag": "${{ needs.detect-release.outputs.python_tag }}"
            }
