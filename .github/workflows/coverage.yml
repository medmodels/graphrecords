name: Check Python Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv sync --group tests

      - name: Create non-isolated coverage report
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m --fail-under=100

      - name: Create isolated coverage report
        if: ${{ always() }}
        run: |
          uv run tests/coverage_report.py xml

      - name: Create isolated coverage comment
        if: github.event.pull_request.base.ref == 'main'
        uses: orgoro/coverage@3f13a558c5af7376496aa4848bf0224aead366ac # v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 1
          thresholdNew: 1
          thresholdModified: 1

      - name: Check isolated coverage
        if: ${{ always() }}
        run: |
          uv run coverage report -m --fail-under=100
