name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release target"
        required: true
        type: choice
        options:
          - rust
          - python
          - both
      version:
        description: "Version override for every selected target (leave empty to use release-drafter's resolved versions)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        if: inputs.target != 'python'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        if: inputs.target != 'python'
        run: cargo install cargo-edit --locked

      - name: Install uv
        if: inputs.target != 'rust'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Get Rust draft release
        id: rust-draft
        if: inputs.target != 'python'
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: release-drafter-rust.yml
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Python draft release
        id: python-draft
        if: inputs.target != 'rust'
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: release-drafter-python.yml
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine versions
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          RUST_RESOLVED_VERSION: ${{ steps.rust-draft.outputs.resolved_version }}
          PYTHON_RESOLVED_VERSION: ${{ steps.python-draft.outputs.resolved_version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            if ! echo "$VERSION_OVERRIDE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version must be in semver format (e.g., 0.2.0)"
              exit 1
            fi
            RUST_VERSION="$VERSION_OVERRIDE"
            PYTHON_VERSION="$VERSION_OVERRIDE"
          else
            RUST_VERSION="$RUST_RESOLVED_VERSION"
            PYTHON_VERSION="$PYTHON_RESOLVED_VERSION"
          fi
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          echo "python=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Rust changelog
        if: inputs.target != 'python'
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ steps.version.outputs.rust }}
          release-notes: ${{ steps.rust-draft.outputs.body }}
          path-to-changelog: CHANGELOG-rust.md
          heading-text: "[${{ steps.version.outputs.rust }}]"

      - name: Update Python changelog
        if: inputs.target != 'rust'
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ steps.version.outputs.python }}
          release-notes: ${{ steps.python-draft.outputs.body }}
          path-to-changelog: CHANGELOG-python.md
          heading-text: "[${{ steps.version.outputs.python }}]"

      - name: Bump Rust version
        if: inputs.target != 'python'
        env:
          VERSION: ${{ steps.version.outputs.rust }}
        run: cargo set-version --workspace "$VERSION"

      - name: Bump Python version
        if: inputs.target != 'rust'
        env:
          VERSION: ${{ steps.version.outputs.python }}
        run: sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' pyproject.toml

      - name: Update uv.lock
        if: inputs.target != 'rust'
        run: uv lock

      - name: Stage Rust files
        if: inputs.target != 'python'
        run: git add CHANGELOG-rust.md Cargo.toml Cargo.lock

      - name: Stage Python files
        if: inputs.target != 'rust'
        run: git add CHANGELOG-python.md pyproject.toml uv.lock

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_VERSION: ${{ steps.version.outputs.rust }}
          PYTHON_VERSION: ${{ steps.version.outputs.python }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            rust)
              TITLE="release(rust): ${RUST_VERSION}"
              RELEASE="rust ${RUST_VERSION}"
              BRANCH="release/rust-${RUST_VERSION}"
              ;;
            python)
              TITLE="release(python): ${PYTHON_VERSION}"
              RELEASE="python ${PYTHON_VERSION}"
              BRANCH="release/python-${PYTHON_VERSION}"
              ;;
            both)
              TITLE="release: rust ${RUST_VERSION}, python ${PYTHON_VERSION}"
              RELEASE="rust ${RUST_VERSION}, python ${PYTHON_VERSION}"
              BRANCH="release/rust-${RUST_VERSION}-python-${PYTHON_VERSION}"
              ;;
          esac

          git checkout -b "$BRANCH"
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "$TITLE"
          git push origin "$BRANCH"

          BODY="## Release ${RELEASE}

          This PR was automatically generated by the release workflow.

          ### Checklist
          - [ ] Changelog looks correct
          - [ ] Version numbers are correct"

          gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
